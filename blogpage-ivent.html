<script>
(async () => {
  const FILTER = "EVENT"; // null = ALL
  const INITIAL = 9, STEP = 9;
  const list = document.getElementById('blog-card-list');
  const btn  = document.querySelector('.blog-more-btn');
  let cards = [], visibleCount = 0;

  function esc(s) {
    return String(s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function showUpTo(n) {
    cards.slice(0, n).forEach(c => c.classList.remove('is-hidden'));
    visibleCount = n;
    if (btn) btn.style.display = visibleCount >= cards.length ? 'none' : '';
  }

  try {
    const res = await fetch('posts.json');
    const posts = await res.json();
    const filtered = FILTER ? posts.filter(p => p.category === FILTER) : posts;

    list.innerHTML = filtered.map(p => `
      <li class="blog-card is-hidden">
        <a href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
          <figure class="blog-card-thumb">
            <img src="${esc(p.thumbnail)}" alt="${esc(p.title)}" loading="lazy">
          </figure>
          <div class="blog-card-meta">
            <span class="blog-card-cat">${esc(p.category)}</span>
            <span class="blog-card-date">${esc(p.date)}</span>
          </div>
          <p class="blog-card-excerpt">${esc(p.excerpt || p.title)}</p>
          <span class="blog-card-more">more...</span>
        </a>
      </li>
    `).join('');

    cards = Array.from(list.querySelectorAll('.blog-card'));
    showUpTo(Math.min(INITIAL, cards.length));
    if (btn) btn.addEventListener('click', () => showUpTo(Math.min(visibleCount + STEP, cards.length)));
  } catch(e) {
    console.error('posts.json の読み込みに失敗しました:', e);
  }
})();
</script>
